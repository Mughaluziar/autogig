# Render Blueprint — deploys the FastAPI backend from ./backend.
# On Render: New → Blueprint → point at this repo, or New Web Service with
# Root Directory = backend and the same build/start commands.
services:
  - type: web
    name: autopilot-api
    runtime: python
    rootDir: backend
    # Free demo plan: sleeps after 15 idle minutes (first request then takes
    # ~1 minute) and has no background queue. For production use 0.5c-512mb
    # (Starter) and enable the paid add-ons at the bottom of this file.
    plan: free
    buildCommand: pip install -r requirements.txt
    # --no-proxy-headers: uvicorn's own X-Forwarded-For handling trusts the LEFTMOST entry (which any caller can
    # forge to dodge the per-IP rate limits) and by default also trusts 127.0.0.1. The app picks the client
    # address itself from the right-hand end of the header (TRUSTED_PROXY_HOPS below, app/security.py) and reads
    # X-Forwarded-Proto itself (app/session.py).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health
    # false: a push never deploys by itself. Deploy deliberately (Manual Deploy) after CI is green on staging.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: API_PREFIX
        value: /api
      # Must include your Vercel frontend URL (add your custom domain later).
      # https only: production refuses to start with any http:// origin (and localhost is not needed).
      - key: CORS_ORIGINS
        value: https://autopilotv2.vercel.app
      # Edge proof (docs/staging-verification.md): the website signs every /api request it proxies with this secret, so
      # the API knows the visitor address it reports and can refuse requests that skip the website. Generate a random
      # 48+ character value ONCE and set the SAME value as EDGE_SHARED_SECRET in Vercel (server-side variable, never
      # NEXT_PUBLIC_). Never commit it.
      - key: EDGE_SHARED_SECRET
        sync: false
      # Turn on ("true") only after staging shows the proof verifies (staging-check.mjs --expect-edge-proof). While
      # false, direct requests to this API address are still accepted (their limits use the address Render appends).
      - key: REQUIRE_EDGE_PROOF
        value: "false"
      # Proxies that append to X-Forwarded-For for a request that does NOT carry a valid edge proof (a direct request):
      # Render's load balancer = 1. Confirm on staging with GET /api/diag/request as the platform owner; do not guess.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Per-IP request counters are shared through MongoDB, so more than one API instance is safe.
      - key: RATE_LIMIT_BACKEND
        value: auto
      # Banking, Marketplace, Capital and Token are simulated demonstrations: only the owner and accounts the owner
      # invites can open them. "all" is refused in production unless ALLOW_PUBLIC_SIMULATED_MODULES=true.
      - key: SIMULATED_MODULES
        value: invited
      - key: EMAIL_VERIFICATION
        value: "true"
      # Comma-separated emails that may open the platform-owner pages.
      - key: OWNER_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # Set this in the Render dashboard (never commit it):
      #   mongodb+srv://<user>:<password>@autopilot.<id>.mongodb.net
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: autopilot
      # Groq — set in the Render dashboard (never commit the key).
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SECRET_KEY
        generateValue: true
      # Automation Worker — set WORKER_URL to the worker service URL below and
      # WORKER_KEY to the same secret on BOTH services (Render dashboard).
      - key: WORKER_URL
        sync: false
      - key: WORKER_KEY
        sync: false
      # Paid add-on: uncomment with autopilot-redis below. The API runs without it.
      # - key: REDIS_URL
      #   fromService:
      #     type: keyvalue
      #     name: autopilot-redis
      #     property: connectionString
      - key: SENTRY_DSN
        sync: false
      # Outbound email (signup verification codes, welcome, invites) via Gmail
      # SMTP. SMTP_USER is the Gmail address; SMTP_PASSWORD is a 16-character
      # Google App Password (needs 2-Step Verification on that account), not
      # the normal Gmail password. With these unset, production skips email
      # verification so signups aren't blocked.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Configure only after an inbound email provider and domain are ready.
      # Job Radar source switches and API keys (see docs/platform-matrix.md).
      - key: JOB_SOURCES_APPROVED
        sync: false
      - key: JOB_SOURCES_DISABLED
        sync: false
      - key: THE_MUSE_API_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: WEB3_CAREER_TOKEN
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: REED_API_KEY
        sync: false
      - key: FINDWORK_API_TOKEN
        sync: false
      - key: HN_COMMERCIAL_REUSE_APPROVED
        sync: false
      - key: REDDIT_ACCESS_TOKEN
        sync: false
      - key: REDDIT_COMMERCIAL_APPROVED
        sync: false
      - key: FREELANCER_API_APPROVED
        sync: false
      - key: INBOUND_EMAIL_DOMAIN
        sync: false
      - key: INBOUND_EMAIL_WEBHOOK_SECRET
        sync: false
      - key: INBOUND_EMAIL_PLATFORMS
        sync: false
      - key: OUTLOOK_INBOX_READ_APPROVED
        value: "false"
      # Upwork has no settings: it is human-in-the-loop (docs/upwork-assistant.md).
      - key: NANGO_SECRET_KEY
        sync: false
      - key: NANGO_BASE_URL
        value: https://api.nango.dev
      - key: NANGO_INTEGRATIONS
        sync: false
      - key: NANGO_WEBHOOK_SIGNING_KEY
        sync: false
      - key: CAPITAL_INVESTOR_JURISDICTIONS
        sync: false
      # Invoice pay links (docs/payments.md). Online payment stays off until
      # STRIPE_SECRET_KEY is set; the webhook rejects calls without its secret.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENTS_CRYPTO_ENABLED
        value: "false"
      - key: PUBLIC_SITE_URL
        sync: false
      # Token program (docs/token-program.md). Off unless set; test networks only
      # until the launch gate passes and TOKEN_MAINNET_ENABLED is true.
      - key: TOKEN_PROGRAM_ENABLED
        value: "false"
      - key: TOKEN_CHAIN_ID
        value: "84532"
      - key: TOKEN_RPC_URL
        sync: false
      - key: TOKEN_ADDRESS
        sync: false
      - key: TOKEN_IDENTITY_REGISTRY
        sync: false
      - key: TOKEN_ID_FACTORY
        sync: false
      - key: TOKEN_SAFE_ADDRESS
        sync: false
      - key: TOKEN_USDC_ADDRESS
        sync: false
      - key: TOKEN_START_BLOCK
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_ALLOWED_TOOLKITS
        sync: false
      - key: ACTIVEPIECES_WEBHOOK_URL
        sync: false
      - key: ACTIVEPIECES_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------------------------
