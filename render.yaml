  #       sync: false
  #     - key: ADZUNA_APP_ID
  #       sync: false
  #     - key: ADZUNA_APP_KEY
  #       sync: false
  #     - key: REED_API_KEY
  #       sync: false
  #     - key: FINDWORK_API_TOKEN
  #       sync: false
  #     - key: HN_COMMERCIAL_REUSE_APPROVED
  #       sync: false
